name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # SUA (loi build "Set up Android SDK" that bai lien tuc tu 15/09):
      # TRUOC DAY co 1 buoc rieng "uses: android-actions/setup-android@v3"
      # o day - action nay co gang cai goi "tools" DA BI GO KHOI Android SDK
      # (sdkmanager bao "Failed to find package 'tools'", exit code 1),
      # khien buoc nay LUON THAT BAI va CHAN dung toan bo job TRUOC KHI
      # Gradle build kip chay (day la loi dang xay ra RONG RAI, khong rieng
      # gi repo nay - nhieu du an khac cung gap dung loi nay cung thoi
      # diem). SUA: BO HAN buoc do - may ao "ubuntu-latest" cua GitHub
      # Actions da co san Android SDK duoc cau hinh day du (ANDROID_HOME,
      # giay phep da chap nhan san), Gradle se tu tai them cac thanh phan
      # SDK con thieu (neu co) trong luc build ma khong can action ngoai
      # nay nua.
      - name: Grant execute permission for gradlew
        # SUA (nguyen nhan build that bai "khong cai dat duoc"): TRUOC DAY
        # gradlew KHONG duoc commit vao repo, moi lan CI phai tu chay
        # "gradle wrapper" de tu sinh no - phu thuoc vao gradle co san tren
        # may ao CI (khong dam bao luon co, hoac ban thao tac tai xuong
        # Gradle rieng cua no co the that bai do mang chap chon) - da xay
        # ra dung 1 lan gay build that bai. Gio gradlew/gradlew.bat/
        # gradle/wrapper/* da duoc commit CO DINH vao repo, chi can chmod
        # +x la du, khong con phu thuoc "gradle" co san tren may CI nua.
        run: chmod +x gradlew

      - name: "Build debug APK (ca 2 flavor: direct + ggplay)"
        run: ./gradlew assembleDebug --stacktrace

      - name: "Upload APK (ban direct - co gioi han quet trung lap)"
        uses: actions/upload-artifact@v4
        with:
          name: QRKeyboard-direct-debug-apk
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk

      - name: "Upload APK (ban ggplay - khong gioi han quet trung lap)"
        uses: actions/upload-artifact@v4
        with:
          name: QRKeyboard-ggplay-debug-apk
          path: app/build/outputs/apk/ggplay/debug/app-ggplay-debug.apk
