name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: "Build debug APK (ca 2 flavor: direct + ggplay)"
        run: ./gradlew assembleDebug --stacktrace

      - name: "Upload APK (ban direct - co gioi han quet trung lap)"
        uses: actions/upload-artifact@v4
        with:
          name: QRKeyboard-direct-debug-apk
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk

      - name: "Upload APK (ban ggplay - khong gioi han quet trung lap)"
        uses: actions/upload-artifact@v4
        with:
          name: QRKeyboard-ggplay-debug-apk
          path: app/build/outputs/apk/ggplay/debug/app-ggplay-debug.apk
