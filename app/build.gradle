plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.qrkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.qrkeyboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Ban Google Play (ggplay) KHONG gioi han so lan xuat du lieu lien tiep
    // giong het nhau khi quet QR/ma vach (theo yeu cau nguoi dung: "riêng
    // bản ggplay: không có giới hạn"). Ban thuong (direct - phat hanh truc
    // tiep ngoai Google Play) van co gioi han (mac dinh 2 lan lien tiep,
    // nguoi dung tu chinh trong Cai dat - xem qrConsecutiveSameLimit trong
    // QrKeyboardService.kt). CA 2 flavor dung CHUNG 1 applicationId (khong
    // doi) de khong lam gian doan nguoi dung dang dung ban cu.
    flavorDimensions = ["distribution"]
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "boolean", "UNLIMITED_CONSECUTIVE_SCAN", "false"
        }
        ggplay {
            dimension "distribution"
            buildConfigField "boolean", "UNLIMITED_CONSECUTIVE_SCAN", "true"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ML Kit Barcode Scanning (quet QR offline, khong can mang)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // THEM: nhan dien van ban trong anh (OCR) - dung cho tinh nang "chup
    // van ban" moi (thay the tinh nang "chup anh" cu, xem QrKeyboardService.kt).
    // Dung ban Latin-only (nhe hon nhieu so voi ban "text-recognition"
    // day du ho tro Trung/Nhat/Han - Tieng Viet dung bang chu Latin nen ban
    // nay du dung, khong can tai them cac model ngon ngu nang khac).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
