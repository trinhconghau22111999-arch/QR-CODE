plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.qrkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.qrkeyboard"
        minSdk 24
        targetSdk 34
        // SUA (cung nguyen nhan lien quan toi loi "cap nhat khong cai duoc"
        // ma nguoi dung phan anh): TRUOC DAY versionCode DUNG YEN o "1" MAI
        // MAI, khong bao gio tang qua bat ky lan build nao - dung 1 con so
        // co dinh nhu vay khien Android khong the phan biet duoc "ban nao
        // moi hon" giua 2 lan build khac nhau. Gio TU TANG theo giay (Unix
        // epoch) - MOI LAN build deu chac chan co versionCode LON HON lan
        // build truoc do.
        //
        // LUU Y CU PHAP GROOVY (da tung gay loi "Value is null" khi build):
        // "versionCode (bieu_thuc).toInteger()" bi Groovy hieu NHAM thanh
        // "versionCode(bieu_thuc).toInteger()" - tuc goi .toInteger() len
        // KET QUA TRA VE cua ham versionCode(...) (vay la null/void), CHU
        // KHONG PHAI len bieu thuc so nhu y dinh. Phai tach ra bien rieng
        // truoc de KHONG con nhap nhang cu phap nao ca.
        def buildVersionCode = (System.currentTimeMillis() / 1000L).toInteger()
        versionCode buildVersionCode
        versionName "1.0"
    }

    // SUA LOI (theo phan anh nguoi dung: "cap nhat app bao khong cai dat
    // duoc, phai go ban cu cai lai"): TRUOC DAY KHONG khai bao signingConfig
    // rieng nao ca - moi lan build debug (`assembleDebug`) tren may CI GitHub
    // Actions (may ao HOAN TOAN MOI moi lan chay, khong luu lai gi giua cac
    // lan build), Android Gradle Plugin TU DONG SINH 1 debug.keystore MOI
    // (chua key ky ngau nhien) NEU chua co san o "~/.android/debug.keystore"
    // - ma may ao CI thi LUON chua co san, nen MOI LAN build la MOT chu ky
    // (signing certificate) KHAC NHAU HOAN TOAN. Android coi day la 2 app
    // "khac nguon goc" du cung applicationId, nen TU CHOI cai de "cap nhat"
    // (INSTALL_FAILED_UPDATE_INCOMPATIBLE, hien ra "khong cai dat duoc") -
    // nguoi dung buoc phai go ban cu di moi cai duoc ban moi, mat het du
    // lieu/cai dat da luu.
    //
    // Sua: dung 1 file keystore CO DINH duoc commit thang vao repo
    // (keystore/qrkeyboard-debug.keystore, mat khau "qrkeyboard123" - day
    // CHi la debug keystore, KHONG dung de phat hanh chinh thuc len Google
    // Play nen khong can bao mat cao, muc dich DUY NHAT la giu CHU KY GIONG
    // NHAU qua MOI LAN build/moi may CI) cho CA 2 buildType (debug/release)
    // - moi APK build ra tu gio ve sau (bao gom ca 2 flavor direct/ggplay)
    // deu cung 1 chu ky, cai de/cap nhat binh thuong, khong con phai go ban
    // cu nua.
    signingConfigs {
        debug {
            storeFile file("../keystore/qrkeyboard-debug.keystore")
            storePassword "qrkeyboard123"
            keyAlias "qrkeyboard"
            keyPassword "qrkeyboard123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Ban Google Play (ggplay) KHONG gioi han so lan xuat du lieu lien tiep
    // giong het nhau khi quet QR/ma vach (theo yeu cau nguoi dung: "riêng
    // bản ggplay: không có giới hạn"). Ban thuong (direct - phat hanh truc
    // tiep ngoai Google Play) van co gioi han (mac dinh 2 lan lien tiep,
    // nguoi dung tu chinh trong Cai dat - xem qrConsecutiveSameLimit trong
    // QrKeyboardService.kt). CA 2 flavor dung CHUNG 1 applicationId (khong
    // doi) de khong lam gian doan nguoi dung dang dung ban cu.
    flavorDimensions "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "boolean", "UNLIMITED_CONSECUTIVE_SCAN", "false"
        }
        ggplay {
            dimension "distribution"
            buildConfigField "boolean", "UNLIMITED_CONSECUTIVE_SCAN", "true"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ML Kit Barcode Scanning (quet QR offline, khong can mang)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
